[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-knowledge-workbench"
version = "0.1.0"
description = "Local versioned engineering knowledge infrastructure"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "mcp>=1.29,<2",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "httpx>=0.28,<1", "coverage>=7,<8"]

[tool.setuptools.package-data]
rfkb = ["schema.sql", "static/*"]

[tool.setuptools.packages.find]
include = ["rfkb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
