<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>射频连接器 · 知识工作台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <script src="/lucide.min.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="知识工作台首页"><span class="brand-mark">RF</span><span>射频连接器<span class="brand-sub">知识工作台</span></span></a>
    <div class="session"><span id="mode" class="badge">连接中</span><label>操作人<input id="actor" maxlength="80" autocomplete="name" placeholder="填写姓名"></label><button id="backup-mobile" class="icon mobile-only" title="备份知识库" aria-label="备份知识库"><i data-lucide="download"></i></button></div>
  </header>
  <div class="shell">
    <aside class="sidebar">
      <nav aria-label="主导航">
        <button class="nav active" data-view="library"><i data-lucide="library"></i>知识条目<span id="count-records">0</span></button>
        <button class="nav" data-view="pending"><i data-lucide="clipboard-check"></i>待审核<span id="count-pending">0</span></button>
        <button class="nav" data-view="evaluate"><i data-lucide="ruler"></i>参数检查</button>
        <button class="nav" data-view="runs"><i data-lucide="history"></i>运行记录<span id="count-runs">0</span></button>
        <button class="nav" data-view="artifacts"><i data-lucide="files"></i>资料附件<span id="count-artifacts">0</span></button>
      </nav>
      <div class="sidebar-bottom"><span class="connection-dot"></span>本地工作区<button id="backup" class="quiet"><i data-lucide="download"></i>备份知识库</button></div>
    </aside>
    <main id="main" tabindex="-1">
      <div class="page-heading"><div><p class="eyebrow">ENGINEERING KNOWLEDGE</p><h1 id="page-title">知识条目</h1></div><div class="actions"><button id="refresh" class="icon" title="刷新" aria-label="刷新"><i data-lucide="refresh-cw"></i></button><button id="new-record" class="primary"><i data-lucide="plus"></i>新建条目</button></div></div>
      <div id="stats" class="stats" aria-label="知识库概况"></div>
      <div id="error" class="notice error" role="alert" hidden></div>
      <section id="workspace" aria-live="polite"></section>
    </main>
  </div>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="record-form">
      <div class="dialog-head"><h2 id="editor-title">新建条目</h2><button type="button" data-close class="icon" aria-label="关闭编辑器" title="关闭"><i data-lucide="x"></i></button></div>
      <div class="dialog-body">
        <div id="form-error" class="notice error" role="alert" hidden></div>
        <div class="form-grid">
          <label class="wide">操作人<input name="actor" maxlength="80" autocomplete="name"></label>
          <label>条目类型<select name="kind" id="edit-kind"></select></label>
          <label>系列 / 适用范围<input name="family" maxlength="100"></label>
          <label class="wide">标题<input name="title" maxlength="200" required></label>
          <label class="wide">摘要<textarea name="summary" rows="2" maxlength="4000"></textarea></label>
          <label class="check wide"><input type="checkbox" name="test_only">仅用于测试的数据</label>
        </div>
        <div id="kind-fields"></div>
        <section class="form-section"><div class="section-head"><h3>依据与固定版本</h3><button type="button" id="add-reference" class="quiet"><i data-lucide="plus"></i>添加依据</button></div><div id="reference-rows"></div></section>
      </div>
      <div class="dialog-foot"><button type="button" data-close>取消</button><button type="submit" id="save-record">保存草稿</button><button type="submit" class="primary" id="publish-record"><i data-lucide="check"></i>校验并发布</button></div>
    </form>
  </dialog>
  <dialog id="review" aria-labelledby="review-title">
    <form id="review-form">
      <div class="dialog-head"><h2 id="review-title">审核</h2><button type="button" data-close class="icon" aria-label="关闭审核" title="关闭"><i data-lucide="x"></i></button></div>
      <div class="dialog-body"><p id="review-record"></p><label>审核人 / 操作人<input name="actor" maxlength="80" required></label><label>审核 / 变更意见<textarea name="note" rows="4" maxlength="4000" required></textarea></label><div id="review-error" class="notice error" role="alert" hidden></div></div>
      <div class="dialog-foot"><button type="button" data-close>取消</button><button type="submit" id="review-submit" class="primary">确认</button></div>
    </form>
  </dialog>
  <dialog id="preview" aria-labelledby="preview-title">
    <div class="dialog-head"><h2 id="preview-title">附件预览</h2><button type="button" data-close class="icon" aria-label="关闭预览" title="关闭预览"><i data-lucide="x"></i></button></div>
    <div class="dialog-body" id="preview-body" aria-live="polite"></div>
    <div class="dialog-foot"><a id="preview-download" download>下载原件</a></div>
  </dialog>
  <div id="toast" role="status" hidden></div>
</body>
</html>
